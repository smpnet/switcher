[workspace]
name = "switcher"
channels = ["conda-forge"]
platforms = ["osx-64", "osx-arm64", "linux-64", "win-64"]

[dependencies]
python = ">=3.13,<3.14"
pip = "*"

[pypi-dependencies]
switcher = { path = ".", editable = true }
ruff = ">=0.6"
basedpyright = "*"
pytest = ">=8"
pytest-cov = "*"
freezegun = "*"
build = "*"
# Used only by the CI `coverage` job to gate PR diffs against coverage.xml;
# local devs don't run it. Kept in the single env (no `ci` env split) to
# match this project's flat env convention.
diff-cover = "*"

[tasks]
test = "pytest tests/unit"
test-integration = "pytest tests/integration -m integration"
test-e2e = "pytest tests/e2e -m e2e"
lint = { cmd = "ruff check src tests && ruff format --check src tests" }
format = "ruff format src tests"
typecheck = "basedpyright src tests"
build = "python -m build"
# Deterministic Windows path verification: parses the shipped builtin TOMLs
# and confirms every windows_path expands without leaving %VAR% tokens.
# SKIPs cleanly on non-Windows. Safe as a CI gate -- pure static check, no
# timing or scheduling sensitivity.
verify-windows = "python scripts/verify_windows_paths.py"

# Strict variant for the self-hosted Windows runner: also fails on MISSING /
# FILE host-state results, so the job actually validates that the runner is
# provisioned with Claude Code / Copilot CLI under the expected accounts.
# Without --strict, the self-hosted job would just rerun what the hosted
# windows-latest matrix already covers.
verify-windows-strict = "python scripts/verify_windows_paths.py --strict"

# Junction atomicity probe -- *not* in `ci` aggregate. The script is
# explicitly probabilistic ("not a proof") and gating CI on a race-probe
# would invite scheduler-induced flakes on shared runners. Run manually
# when investigating Windows swap_link behavior; if the result ever drives
# a production code change, revisit whether to wire it back in (and how to
# make the assertion deterministic first).
verify-junction = "python scripts/verify_junction.py"

# `check` is what gets invoked as the per-OS CI gate (lint + typecheck +
# tests + verify-windows). The `build` step is intentionally NOT part of
# `check`: the release workflow and the dedicated CI `build` job each
# invoke `pixi run build` directly, so folding it in would build twice.
# `ci` (= check + build) stays as a one-call convenience target for local
# use. (verify-junction stays out of both -- see its task block above
# for why.)
check = { depends-on = ["lint", "typecheck", "test", "test-integration", "test-e2e", "verify-windows"] }
ci = { depends-on = ["check", "build"] }
