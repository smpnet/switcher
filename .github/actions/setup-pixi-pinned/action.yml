name: Set up pinned pixi
description: >
  Single source of truth for the prefix-dev/setup-pixi action SHA and the
  pinned pixi-version. Bump both here and every dependent (test job's
  composite, test-windows's direct invocation) picks up the change
  automatically -- prevents the SHA / version from drifting silently
  between bootstrap callsites.

runs:
  using: composite
  steps:
    # Pinned to immutable commit SHA (= tag v0.8.14) for supply-chain
    # hardening. Bump along with any other action audits during the
    # next security review. Upstream has cut a v0.9 line; stay on v0.8.x
    # until v0.9's setup contract changes have been audited.
    - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514  # v0.11.0
      with:
        pixi-version: v0.66.0
        cache: true
