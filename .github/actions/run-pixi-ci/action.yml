name: Run pixi check tasks
description: >
  Set up pixi and invoke the `check` task. The pixi.toml `check =
  { depends-on = [...] }` aggregate is the single authoritative task
  list for the test matrix -- the workflow runs whatever pixi.toml says
  it runs, end of story. Wheel building runs in its own workflow job so
  the pure-Python artifact isn't rebuilt across the OS matrix. Per-task
  pass/fail visibility comes through pixi's own `✨ Pixi task (X)`
  output in the step log; one click vs. one glance is the trade we make
  for not having a duplicate step list to drift.

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-pixi-pinned

    # Per-platform shell selection: `shell: bash` would assume Git for
    # Windows is installed on every Windows runner, which holds for
    # github-hosted windows-latest but is NOT a contract on self-hosted
    # runners (those may be provisioned without Git). PowerShell ships
    # with Windows itself, so it's the most portable Windows shell.
    # On POSIX, plain bash is universal.

    - name: Run check task list (POSIX)
      if: runner.os != 'Windows'
      shell: bash
      run: pixi run check

    - name: Run check task list (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: pixi run check
