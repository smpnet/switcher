name: Release

# Triggers on tag push only — the tag IS the release. No workflow_dispatch
# (would split the source-of-truth across the tag and the workflow input)
# and no `release: types: [created]` (would split the source-of-truth across
# the tag and the manually-created Release object).
on:
  push:
    tags: ['v*']

# `gh release create` needs write access to contents to create the Release
# object and upload artifacts. Workflow-level permissions apply to all jobs
# (there's only one); explicit declaration is required because the default
# token has only read.
permissions:
  contents: write

# `cancel-in-progress: false` because cancelling a release mid-flight leaves
# a partially-uploaded Release object behind. Keyed on github.ref so the same
# tag never has two concurrent runs; different tags don't collide.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    timeout-minutes: 20
    # Linux only — wheel is pure-Python (identical bytes regardless of build
    # OS). The matrix CI on the merged commit already exercised cross-OS
    # behavior; re-validating on the tagged commit doesn't add signal.
    runs-on: ubuntu-latest
    steps:
      # Pinned to the same SHA as ci.yml to keep one source of truth for the
      # action version. fetch-depth: 0 is required for hatch-vcs to derive
      # the version from `git describe --tags`.
      - name: Checkout at tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      # Cheapest gate first — string match against the tag name. Hard-rejects
      # malformed tags (vfoo, v0.1, v0.1.0.0, v0.1.2-RC1 with capital R, v0.1.2-pre)
      # before any other release machinery runs. Distinguishes "intentional
      # prerelease" from "tag typo" — the latter never produces an artifact.
      # The accepted shapes are vX.Y.Z (stable) or vX.Y.Z-(rc|alpha|beta)N
      # (prerelease). Other suffixes are deliberately not supported here;
      # extend this regex if a new prerelease shape becomes needed.
      - name: Validate tag shape
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(rc|alpha|beta)[0-9]+)?$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match expected shape: vX.Y.Z or vX.Y.Z-(rc|alpha|beta)N"
            exit 1
          fi

      # Closes the failure mode where the tag points at a stray branch HEAD or
      # a typo'd SHA. Tag protection (configured separately as a tag ruleset)
      # restricts who-can-tag and whether-tags-can-be-deleted, but does not
      # restrict where-the-tag-points. This check does.
      #
      # The check is `--is-ancestor`, not exact-tip equality against
      # `refs/remotes/origin/main`. That's deliberate: back-tagging an older
      # `main` commit is a legitimate (if rare) operation — e.g. cutting a
      # hotfix from a known-good earlier commit when newer `main` work isn't
      # yet ready to ship. Branch protection on `main` enforces forward-only
      # history (no force-push, no deletion), so any ancestor of
      # `refs/remotes/origin/main` is by construction a commit that passed PR
      # review and CI at the time it merged. The intent of this gate is "tag
      # is on main", not "tag is at the current tip of main".
      #
      # Two fetch/compare details worth knowing:
      #   1. `git fetch origin main:refs/remotes/origin/main` updates the
      #      remote-tracking ref explicitly. Plain `git fetch origin main`
      #      only updates FETCH_HEAD, which would leave refs/remotes/origin/main
      #      stale or absent in the workflow's fresh clone.
      #   2. We compare HEAD (which actions/checkout has already pointed at the
      #      tag-resolved commit) rather than $GITHUB_SHA — HEAD is unambiguously
      #      a commit SHA after checkout, sidestepping any annotated-tag-object-
      #      vs-commit ambiguity.
      # Full fetch (no --depth) is used: release safety justifies the extra
      # seconds, and a shallow fetch could miss the merge-base relationship
      # for older tags.
      - name: Verify tag is on main
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main \
            || { echo "::error::tag $GITHUB_REF_NAME is not on main"; exit 1; }

      - name: Setup pixi
        uses: ./.github/actions/setup-pixi-pinned

      # Defense-in-depth re-run on the tagged commit. Catches drift between
      # when main CI went green and when the tag was pushed (another merge
      # landed, an admin bypass force-pushed, a runner image updated). Calls
      # `pixi run check` (not `pixi run ci`) so build doesn't run twice;
      # build is the next step.
      - name: Re-run validation on tagged commit
        run: pixi run check

      # Compute the expected package version from the triggering tag.
      # Maps GITHUB_REF_NAME (validated by 'Validate tag shape' above to
      # vX.Y.Z[-(rc|alpha|beta)N]) to a PEP 440-canonical version string:
      #   v0.1.2          -> 0.1.2
      #   v0.1.2-rc1      -> 0.1.2rc1
      #   v0.1.2-alpha1   -> 0.1.2a1
      #   v0.1.2-beta1    -> 0.1.2b1
      # PEP 440 normalizes alpha->a and beta->b; rc stays as rc. The
      # tag-shape regex makes these suffixes mutually exclusive, so sed
      # ordering doesn't matter. Used by 'Verify artifact version matches
      # tag' below.
      - name: Compute expected version from tag
        id: expected_version
        run: |
          EXPECTED=$(echo "$GITHUB_REF_NAME" | sed -E -e 's/^v//' -e 's/-alpha/a/' -e 's/-beta/b/' -e 's/-rc/rc/')
          echo "version=$EXPECTED" >> "$GITHUB_OUTPUT"
          echo "Expected package version for tag $GITHUB_REF_NAME: $EXPECTED"

      - name: Build artifacts
        run: pixi run build

      # Defensive shape check before publish. `python -m build` produces both
      # a wheel and an sdist by default — but a hatchling/hatch-vcs config
      # regression (or a future build-backend bug) could silently drop one.
      # Without this gate, the next step's `dist/*.whl` install path would
      # still pass and `gh release create dist/*` would publish an incomplete
      # release. Assert exactly one of each shape before we go further.
      - name: Verify dist contents
        run: |
          shopt -s nullglob
          wheels=( dist/*.whl )
          sdists=( dist/*.tar.gz )
          if [[ ${#wheels[@]} -ne 1 || ${#sdists[@]} -ne 1 ]]; then
            echo "::error::expected exactly 1 wheel and 1 sdist in dist/, got ${#wheels[@]} wheel(s) and ${#sdists[@]} sdist(s)"
            ls -la dist/ >&2
            exit 1
          fi

      # Verify the built artifact's version matches the triggering tag.
      # Catches two failure modes BEFORE the artifact ever reaches a
      # GitHub Release object:
      #
      #   1. fallback-version (0.0.0+unknown) silently activates if tag
      #      history is unreachable in CI (fetch-depth regression,
      #      hatch-vcs behavior change). Without this gate, a
      #      0.0.0+unknown wheel could publish on a v0.1.2 release.
      #
      #   2. Same-commit dual-tag ambiguity. RELEASE.md's RC dogfood
      #      path encourages tagging both vX.Y.Z-rc1 and vX.Y.Z on
      #      the same commit (rc1 validates -> stable on the same SHA).
      #      `git describe --tags --exact-match` returns the most
      #      recently CREATED tag on a commit, not necessarily the
      #      one that triggered THIS workflow run. So a re-run of
      #      the rc1 workflow after v0.1.2 has been added could
      #      build version `0.1.2` and try to publish it to the
      #      v0.1.2-rc1 Release. This gate fails loudly instead.
      #
      # Why post-build verification rather than env-var pinning at the
      # source: SETUPTOOLS_SCM_PRETEND_VERSION (and its hatch-vcs
      # equivalents) are NOT propagated through `python -m build`'s
      # isolated build environment. Verified locally. Switching to
      # `--no-isolation` would trade reproducibility for env-var
      # propagation. Verifying the built artifact instead achieves the
      # same end-state guarantee — no wrong-version artifact ever
      # publishes — without changing the build model.
      - name: Verify artifact version matches tag
        env:
          EXPECTED: ${{ steps.expected_version.outputs.version }}
        run: |
          shopt -s nullglob
          wheels=( dist/*.whl )
          sdists=( dist/*.tar.gz )
          WHEEL_NAME=$(basename "${wheels[0]}")
          SDIST_NAME=$(basename "${sdists[0]}")
          # PEP 427: wheel filename is {name}-{version}-{python}-{abi}-{platform}.whl
          # PEP 625: sdist filename is {name}-{version}.tar.gz
          WHEEL_VERSION=$(echo "$WHEEL_NAME" | cut -s -d- -f2)
          SDIST_VERSION=$(echo "$SDIST_NAME" | sed -E 's/^switcher-(.+)\.tar\.gz$/\1/')
          if [[ "$WHEEL_VERSION" != "$EXPECTED" ]]; then
            echo "::error::wheel version drift: tag=$GITHUB_REF_NAME, expected=$EXPECTED, wheel=$WHEEL_VERSION"
            exit 1
          fi
          if [[ "$SDIST_VERSION" != "$EXPECTED" ]]; then
            echo "::error::sdist version drift: tag=$GITHUB_REF_NAME, expected=$EXPECTED, sdist=$SDIST_VERSION"
            exit 1
          fi

      # Catches packaging-time breakage that `pixi run check` cannot — wrong
      # entry point, missing builtin TOMLs in the wheel, dep typo that only
      # surfaces on a fresh install.
      #
      # `switcher version` outputs "switcher v<version>" (per cli.py line 80) —
      # strip the "switcher v" prefix before comparing to the wheel filename
      # version (which has no prefix). Both pass through hatch-vcs / PEP 440
      # normalization the same way, so an exact string match after stripping
      # is the right contract.
      #
      # `switcher tools` exercises the entry point and confirms the built-in
      # TOMLs (claude.toml, copilot.toml) are present in the wheel.
      - name: Wheel install smoke test
        run: |
          # The "Verify dist contents" step above already enforces exactly
          # one wheel and one sdist before we get here — no need for a
          # second guard. Just resolve the single wheel path.
          shopt -s nullglob
          WHEELS=(dist/*.whl)
          WHEEL_PATH="${WHEELS[0]}"
          # Use pixi run python so the smoke-test venv is created with the
          # pixi-pinned interpreter (Python 3.13.13 currently), not the
          # runner's ambient python. Runner images drift; the project
          # pins Python explicitly to avoid that drift in matrix CI, and
          # the smoke test should match.
          pixi run python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install "$WHEEL_PATH"
          INSTALLED=$(/tmp/smoke/bin/switcher version | sed -E 's/^switcher v//')
          # PEP 427 wheel filename: {name}-{version}(-{build})?-{python}-{abi}-{platform}.whl
          # PEP 440-normalized versions never contain '-', so field 2 is
          # always the version. Using `cut -s` instead of a regex is robust
          # against future tag changes (build tag addition, abi/platform
          # variants) and produces empty output if the filename has no '-'
          # at all — which is what the explicit parse-failure guard below
          # catches. This avoids the previous failure mode where a sed
          # mismatch silently left $WHEEL as the full filename and the
          # downstream check produced a misleading "version mismatch"
          # error instead of "failed to parse wheel filename".
          WHEEL_NAME=$(basename "$WHEEL_PATH")
          WHEEL=$(echo "$WHEEL_NAME" | cut -s -d- -f2)
          if [[ -z "$WHEEL" ]]; then
            echo "::error::failed to parse wheel filename: $WHEEL_NAME"
            exit 1
          fi
          if [[ "$INSTALLED" != "$WHEEL" ]]; then
            echo "::error::version mismatch: installed=$INSTALLED, wheel=$WHEEL"
            exit 1
          fi
          /tmp/smoke/bin/switcher tools >/dev/null

      # Stable allow-list pattern: only ^vX.Y.Z$ (no suffix, no metadata)
      # becomes a "Latest release". Anything else that survived the tag-shape
      # gate (i.e. -(rc|alpha|beta)N suffixes) is published as prerelease.
      # Bias is conservative: anything not matching the strict stable pattern
      # defaults to less visibility, not more.
      - name: Determine prerelease flag
        id: prerelease
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "flag=" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--prerelease" >> "$GITHUB_OUTPUT"
          fi

      # --generate-notes builds the release body from PRs and commits since
      # the previous tag. Conventional Commits (used throughout the repo)
      # keep the auto-output legible. CHANGELOG.md is deliberately deferred
      # until the going-public boundary; see docs/RELEASE.md.
      #
      # Idempotency: `gh release create` fails with "release already exists"
      # if the Release object was created on a previous run that then failed
      # during artifact upload. Detect-and-upload-with-clobber on the rerun
      # path makes this step rerun-safe — re-running a failed workflow
      # finishes the publish instead of getting stuck behind manual cleanup.
      #
      # Notes refresh on rerun: the rc1 fix recipe in docs/RELEASE.md uses
      # `git tag -fa` + `git push --force` to force-move a prerelease tag
      # at a new commit. On that rerun, --clobber takes care of the
      # artifacts, but the existing Release notes still describe the OLD
      # commit range. `gh release edit` doesn't expose --generate-notes
      # directly, so we hit the API endpoint that produces the same body
      # and feed it via --notes. Result: fresh notes on every rerun, not
      # just fresh artifacts.
      #
      # PRERELEASE_FLAG is routed through env (not interpolated directly
      # into the shell script) per GitHub's script-injection hardening
      # guidance; the value is deterministic, but the pattern matters.
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE_FLAG: ${{ steps.prerelease.outputs.flag }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
                      -f tag_name="$GITHUB_REF_NAME" --jq .body)
            gh release edit "$GITHUB_REF_NAME" --notes "$notes"
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --generate-notes \
              $PRERELEASE_FLAG
          fi
