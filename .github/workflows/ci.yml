name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest }
          - { os: macos-latest }
          - { os: [self-hosted, Windows, X64] }

    runs-on: ${{ matrix.os }}
    # Python version is pinned via pixi.toml ([dependencies] python = ">=3.13,<3.14")
    # and resolved by setup-pixi -- no system Python is consulted, so a matrix
    # `python` dimension here would be dead noise.

    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.66.0
          cache: true

      - name: Lint
        run: pixi run lint

      - name: Type check
        run: pixi run typecheck

      - name: Unit tests
        run: pixi run test

      - name: Integration tests
        run: pixi run test-integration

      - name: E2E tests
        run: pixi run test-e2e

      - name: Windows verification spikes
        if: runner.os == 'Windows'
        run: pixi run verify-windows

      - name: Build wheel
        run: pixi run build
