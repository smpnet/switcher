name: CI

on:
  # Trigger on every push (no branch filter) so feature-branch development
  # gets CI signal before a PR exists -- catches regressions early and
  # exercises the workflow itself before relying on it for a PR gate.
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel older in-progress runs for the same logical unit of work when a
# newer one arrives. Use PR number on pull_request events (fork-unique --
# two forks with the same branch name don't collide) and the full ref on
# push events. Same-repo push+PR double-fires aren't deduped; that's the
# acceptable cost for fork-PR isolation correctness.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The actual step list (setup-pixi, lint, typecheck, test, test-integration,
  # test-e2e, verify-windows, build) lives in .github/actions/run-pixi-ci/
  # action.yml -- a composite action both jobs invoke. There is exactly one
  # source of truth for what CI runs, with per-step GitHub UI visibility
  # preserved through the composite's nested steps.

  # GitHub-hosted runners: always run, including for fork PRs. These are
  # ephemeral and isolated, so untrusted PR code is safe here. windows-latest
  # is in the hosted matrix so the verify-windows scripts get exercised on
  # every push/PR (including fork PRs), closing the gap where the self-hosted
  # Windows job is gated away from forks. The test-windows job below stays
  # for the host-state diagnostics that need a provisioned runner with
  # Claude Code / Copilot CLI actually installed.
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Python version is pinned via pixi.toml ([dependencies] python = ">=3.13,<3.14")
    # and resolved by setup-pixi -- no system Python is consulted, so a matrix
    # `python` dimension here would be dead noise.
    steps:
      # Pinned to immutable commit SHA (= tag v4) for the same supply-chain
      # hardening reason setup-pixi is pinned in run-pixi-ci/action.yml;
      # bump on the v0.2.0 security review.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: ./.github/actions/run-pixi-ci

  # Self-hosted Windows runner: provisioned-tool sanity check ONLY.
  #
  # The hosted matrix above already runs the full CI aggregate on
  # windows-latest, so duplicating it here would be expensive duplication.
  # What the self-hosted runner uniquely contributes is a real, stable
  # Windows account where Claude Code + Copilot CLI are actually installed
  # under USERPROFILE / LOCALAPPDATA. This job invokes verify-windows-strict,
  # which fails on MISSING / FILE host-state results -- so the job has a
  # specific, narrow contract: 'this runner is still correctly provisioned
  # for the tools we ship builtins for'.
  #
  # Gated two ways:
  #   1. !github.event.repository.fork restricts the job to the canonical
  #      (non-fork) repo so a fork push doesn't queue a job onto a
  #      [self-hosted, Windows, X64] runner that exists only in the
  #      upstream repo. Deriving from metadata (rather than hardcoding a
  #      repo slug like 'owner/name') keeps the job alive across repo
  #      renames and transfers -- a host-provisioning monitor that
  #      silently stops running after a rename would be the worst failure
  #      mode for this kind of check.
  #   2. The fork-PR check protects self-hosted infrastructure from
  #      executing untrusted PR code (privilege escalation / secret
  #      exfiltration via workflow injection). Same-repo PRs and pushes
  #      still run normally.
  test-windows:
    if: ${{ !github.event.repository.fork && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    timeout-minutes: 15
    runs-on: [self-hosted, Windows, X64]
    steps:
      # checkout pinned to immutable commit SHA (= tag v4) for the same
      # supply-chain hardening reason setup-pixi is pinned; bump on the
      # v0.2.0 security review.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      # Pinned setup-pixi lives in setup-pixi-pinned/action.yml so this
      # job and run-pixi-ci/ share one source of truth for the SHA +
      # pixi-version, preventing silent bootstrap drift between jobs.
      - uses: ./.github/actions/setup-pixi-pinned
      - name: Verify provisioned tool state (host-strict)
        shell: powershell
        run: pixi run verify-windows-strict
