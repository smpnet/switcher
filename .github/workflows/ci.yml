name: CI

on:
  # Filtered to main only. Earlier in v0.1.0 development this had no branch
  # filter so feature-branch pushes got CI signal before a PR existed --
  # appropriate when commits went direct to feat/v0.1.0. Once branch
  # protection on main started enforcing PR-required + CI-required, the
  # unfiltered push trigger meant every push to a PR branch fired CI twice
  # (once via push, once via pull_request). The pull_request event covers
  # in-flight PR work; the push trigger here remains for direct-to-main
  # pushes (admin bypass / merges via the PR UI) where defense-in-depth
  # CI on the resulting commit is still useful.
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel older in-progress runs for the same logical unit of work when a
# newer one arrives. Use PR number on pull_request events (fork-unique --
# two forks with the same branch name don't collide) and the full ref on
# push events. Same-repo push+PR double-fires aren't deduped; that's the
# acceptable cost for fork-PR isolation correctness.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The matrix `test` job invokes the .github/actions/run-pixi-ci composite,
  # which runs `pixi run check` -- whatever the check aggregate names in
  # pixi.toml is what the matrix runs, with no duplicate step list here to
  # drift. The standalone `build` job below builds the wheel + sdist on
  # ubuntu-latest only (pure-Python artifact; an OS matrix would be redundant)
  # and uploads the result as a downloadable artifact.

  # GitHub-hosted runners: always run, including for fork PRs. These are
  # ephemeral and isolated, so untrusted PR code is safe here. windows-latest
  # is in the hosted matrix so the verify-windows scripts get exercised on
  # every push/PR (including fork PRs), closing the gap where the self-hosted
  # Windows job is gated away from forks. The test-windows job below stays
  # for the host-state diagnostics that need a provisioned runner with
  # Claude Code / Copilot CLI actually installed.
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Python version is pinned via pixi.toml ([dependencies] python = ">=3.13,<3.14")
    # and resolved by setup-pixi -- no system Python is consulted, so a matrix
    # `python` dimension here would be dead noise.
    steps:
      # Pinned to immutable commit SHA (= tag v4) for the same supply-chain
      # hardening reason setup-pixi is pinned in run-pixi-ci/action.yml;
      # bump on the v0.1.5 security review.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # hatch-vcs reads `git describe --tags` whenever the package is
          # installed or built. Without full tag history it produces a
          # 0.0.0+local-style version, which trips both `pixi install`
          # (used by every job) and `pixi run build`. release.yml and
          # the `build` job below also use fetch-depth: 0 for the same
          # reason.
          fetch-depth: 0
      - uses: ./.github/actions/run-pixi-ci

  # Coverage gate. ubuntu-only by design -- coverage measurement is
  # OS-independent for a pure-Python package, so running it across the
  # three-OS matrix would just triple runner time without adding signal.
  # The matrix `test` job above is what enforces cross-OS behavior; this
  # job's contract is narrower: "the suite hits enough lines/branches,
  # and new code in this PR is tested."
  coverage:
    name: Coverage (pytest + diff-cover)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # diff-cover compares against origin/<base_ref> to compute the
          # patch coverage delta; a shallow checkout would miss the base
          # history. fetch-depth: 0 also keeps hatch-vcs version derivation
          # working, matching every other job in this file.
          fetch-depth: 0
      - uses: ./.github/actions/setup-pixi-pinned
      - name: pytest with coverage
        # Threshold: 85% -- ~5 points below the 90% baseline measured on
        # main (855 tests, 2026-05-19). The cushion absorbs legitimate
        # refactors that delete well-covered lines without flapping the
        # gate; the real "no untested new code" enforcement lives in
        # the diff-cover step below. Branch coverage is enabled so logic
        # with un-tested forks counts against the total.
        shell: bash
        run: |
          pixi run -- pytest \
            --cov=switcher \
            --cov-branch \
            --cov-report=term \
            --cov-report=xml \
            --cov-fail-under=85
      - name: Patch coverage (diff-cover)
        # Gates new / changed executable lines in the PR diff at 90%.
        # coverage.py's "executable line" rule excludes docstrings,
        # comments, and import-only lines, so doc-only PRs don't trip
        # false failures. *cli.py is excluded because argparse plumbing
        # is awkward to unit-test and dilutes the signal -- mirrors
        # the same exclude used in the sibling brainiac project.
        # Only runs on pull_request events; push events have no
        # meaningful base diff to compare against.
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          pixi run -- diff-cover coverage.xml \
            --compare-branch=origin/${{ github.base_ref }} \
            --exclude '*cli.py' \
            --fail-under=90

  # Linux-only wheel + sdist build. The package is pure-Python (no compiled
  # extensions), so the artifact is identical regardless of build OS -- running
  # it across the three-OS test matrix was redundant. This job runs once and
  # uploads the resulting wheel + sdist as a downloadable artifact, which
  # later release-artifact wiring can pull from at tag time.
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # hatch-vcs reads `git describe --tags` at build time to derive the
          # package version. A shallow checkout would produce a 0.0.0+local-style
          # version and break the build -- same reason the test job above and
          # release.yml use fetch-depth: 0.
          fetch-depth: 0
      - uses: ./.github/actions/setup-pixi-pinned
      - name: Build wheel + sdist
        shell: bash
        run: pixi run build
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: switcher-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Self-hosted Windows runner: provisioned-tool sanity check ONLY.
  #
  # The hosted matrix above already runs `pixi run check` on
  # windows-latest, so duplicating it here would be expensive duplication.
  # What the self-hosted runner uniquely contributes is a real, stable
  # Windows account where Claude Code + Copilot CLI are actually installed
  # under USERPROFILE / LOCALAPPDATA. This job invokes verify-windows-strict,
  # which fails on MISSING / FILE host-state results -- so the job has a
  # specific, narrow contract: 'this runner is still correctly provisioned
  # for the tools we ship builtins for'.
  #
  # Gated three ways:
  #   1. vars.HAS_SELF_HOSTED_WINDOWS == 'true' is the runner-presence
  #      gate. Without a provisioned [self-hosted, Windows, X64] runner,
  #      the job sits in 'queued' state until timeout-minutes fires --
  #      polluting every PR's check status with a 15-min red check that
  #      isn't telling you anything about the code. The variable is set
  #      in the repo's Settings -> Secrets and variables -> Actions ->
  #      Variables tab when (and only when) a runner is actually online.
  #      The decision about what to do with this job longer-term lives
  #      in docs/v0.1.5.md ("Re-evaluate self-hosted Windows CI job").
  #   2. !github.event.repository.fork restricts the job to the canonical
  #      (non-fork) repo so a fork push doesn't queue a job onto a
  #      [self-hosted, Windows, X64] runner that exists only in the
  #      upstream repo. Deriving from metadata (rather than hardcoding a
  #      repo slug like 'owner/name') keeps the job alive across repo
  #      renames and transfers -- a host-provisioning monitor that
  #      silently stops running after a rename would be the worst failure
  #      mode for this kind of check.
  #   3. The fork-PR check protects self-hosted infrastructure from
  #      executing untrusted PR code (privilege escalation / secret
  #      exfiltration via workflow injection). Same-repo PRs and pushes
  #      still run normally.
  test-windows:
    if: ${{ vars.HAS_SELF_HOSTED_WINDOWS == 'true' && !github.event.repository.fork && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    timeout-minutes: 15
    runs-on: [self-hosted, Windows, X64]
    steps:
      # checkout pinned to immutable commit SHA (= tag v4) for the same
      # supply-chain hardening reason setup-pixi is pinned; bump on the
      # v0.1.5 security review.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # See the matrix-job comment above — hatch-vcs needs full tag
          # history. verify-windows-strict doesn't itself build, but
          # consistency across all checkouts in this workflow is the
          # right default.
          fetch-depth: 0
      # Pinned setup-pixi lives in setup-pixi-pinned/action.yml so this
      # job and run-pixi-ci/ share one source of truth for the SHA +
      # pixi-version, preventing silent bootstrap drift between jobs.
      - uses: ./.github/actions/setup-pixi-pinned
      - name: Verify provisioned tool state (host-strict)
        shell: powershell
        run: pixi run verify-windows-strict
