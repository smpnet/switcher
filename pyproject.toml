[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "switcher"
dynamic = ["version"]
description = "Switch between AI-agent configuration profiles in one command"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Switcher Authors" }]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "rich>=13.0",
  "platformdirs>=4.0",
]

[project.scripts]
switcher = "switcher.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/switcher"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# Auto-generated by hatch-vcs at build time; not subject to lint/format checks.
extend-exclude = ["src/switcher/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PTH", "RUF", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # allow `assert False` in tests

[tool.basedpyright]
include = ["src", "tests"]
# Auto-generated by hatch-vcs at build time; symmetric with the ruff exclusion above.
exclude = ["src/switcher/_version.py"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
reportMissingTypeStubs = false
reportUnknownParameterType = "none"  # too noisy for typer/pydantic
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"

[tool.pytest.ini_options]
markers = [
  "integration: integration tests (real filesystem)",
  "e2e: end-to-end tests (subprocess)",
]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.version]
source = "vcs"
# Defensive default for environments where `git describe --tags` cannot
# resolve (e.g. installing from a `git archive` tarball, shallow clones
# without tag history). Production wheels are built from tag pushes
# inside release.yml, where this never fires.
fallback-version = "0.0.0+unknown"

# Note on pixi.lock churn: the local `switcher` package entry in pixi.lock
# carries the hatch-vcs-derived dev-marker version
# (e.g. 0.1.2.dev3+g<sha>.dYYYYMMDD). Re-resolving the lockfile on a new
# commit will rewrite that one line, even when no dependencies have moved.
# This is the intentional trade-off for git-tag-derived versioning per the
# v0.1.2 design spec §2 — the alternative (literal `version = "X.Y.Z"`)
# reintroduces the bump-then-tag coordination footgun. Reviewers should
# treat a single-line pixi.lock diff that only updates the switcher version
# as benign churn, not a dependency change.

[tool.hatch.build.hooks.vcs]
version-file = "src/switcher/_version.py"
